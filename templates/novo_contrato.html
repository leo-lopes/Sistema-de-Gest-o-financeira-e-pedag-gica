{% extends "base.html" %}
{% block title %}Novo Contrato - {{ aluno.nome }}{% endblock %}

{% block content %}
<h2>Adicionar novo contrato para {{ aluno.nome }}</h2>
<p><strong>Responsável:</strong> {{ aluno.responsavel }}</p>

{% if erro %}
<div style="color: red; padding: 10px; border: 1px solid red; margin: 10px 0;">
    {{ erro }}
</div>
{% endif %}

<form method="post">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div>
            <h3>Informações do Contrato</h3>

            <!-- NOVO CAMPO -->
            <label>
                Número do Contrato *:
                <input type="text" name="numero_contrato" required placeholder="Ex: 51-2, MAT-2024-001">
                <small style="color: #666;">Número único do contrato</small>
            </label>

            <label>
                Data Início *:
                <input type="date" name="data_inicio" value="{{ hoje }}" required>
            </label>

            <label>
                Data Fim *:
                <input type="date" name="data_fim" required>
            </label>
        </div>

        <div>
            <h3>Valores</h3>

            <label>
                Valor Total (R$) *:
                <input type="number" step="0.01" name="valor_total" required>
            </label>

            <label>
                Quantidade de Parcelas *:
                <input type="number" name="qtd_parcelas" min="1" value="12" required>
            </label>

            <label>
                Observações:
                <textarea name="observacoes" rows="4"></textarea>
            </label>
        </div>
    </div>

    <br><br>

    <button type="submit">Criar Contrato</button>
    <a href="{{ url_for('detalhe_aluno', aluno_id=aluno.id) }}" style="margin-left: 20px;">
        Cancelar
    </a>
</form>

<style>
    label {
        display: block;
        margin-bottom: 15px;
    }

    input[type="text"],
    input[type="date"],
    input[type="number"],
    textarea {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        box-sizing: border-box;
    }
</style>
{% endblock %}
